<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bar Inventory{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom mb-4">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand" href="{{ url_for('landing') }}">Bar Inventory</a>
      <div class="d-flex gap-2">
        <a href="{{ url_for('landing') }}" class="btn btn-outline-primary btn-sm">Home</a>
        <button class="btn btn-outline-secondary btn-sm" onclick="history.back()">← Back</button>
        {% block nav_extra %}{% endblock %}
      </div>
    </div>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="alert alert-warning">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
  <script>
    // If the browser restores this page from its back/forward cache, reload it so
    // the server re-checks login state instead of showing a stale copy.
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) { window.location.reload(); }
    });
  </script>
  
  <script>
    // Any <form data-confirm="..."> asks for confirmation before it submits.
    document.addEventListener("submit", function (event) {
      const message = event.target.dataset.confirm;
      if (message && !window.confirm(message)) {
        event.preventDefault();   // user pressed Cancel: stop the form from sending
      }
    });
  </script>
</body>
</html>
