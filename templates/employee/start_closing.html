{% extends "base.html" %}
{% block title %}Start Closing{% endblock %}
{% block content %}
  <div class="mx-auto my-5" style="max-width: 400px;">
    <h1 class="mb-3">Start closing</h1>
    <p class="text-muted">Enter your employee code.</p>
    <form method="post" action="{{ url_for('employee.start_closing') }}" data-pin-form data-mode="replace">
      <div data-error class="alert alert-danger d-none"></div>
      <input type="password" name="code" inputmode="numeric" autocomplete="off"
             class="form-control form-control-lg mb-3" placeholder="Employee code" required autofocus>
      <button type="submit" class="btn btn-success w-100">Start inventory check</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='pin-login.js') }}"></script>
{% endblock %}
